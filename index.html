<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Todo List</title><script defer="defer" src="main.js"></script></head><body><div class="wrapper"><header class="header full-bleed"><img src="c473f8de118b0c4d8ed8.svg" alt="Todo list manager logo"/><h1 class="logo-text">Планировщик задач</h1></header><aside class="projects-container"><div class="projects-container-header"><button class="project-add"><img src="6e4693a97a933b9a52d5.svg" alt=""><p>Добавить список дел</p></button></div><ul class="projects-list"><li class="project-item"><button class="project-name">Приготовить еду</button> <button class="project-delete"><img src="8df2b8995c6c2b873fa7.svg" alt="Delete project"/></button></li><li class="project-item"><button class="project-name">Сделать уборку</button> <button class="project-delete"><img src="8df2b8995c6c2b873fa7.svg" alt="Delete project"/></button></li></ul></aside><div class="project-picked"><p class="project-name-header">Выбранный проект:</p><h2 class="project-picked-name">Приготовить еду</h2><div class="project-actions"><button class="project-name-change"><img src="9240b07835d0d3089349.svg" alt="Edit project"><p>Изменить имя</p></button> <button class="todo-add"><img src="6e4693a97a933b9a52d5.svg" alt="Add todo"><p>Добавить задачу</p></button></div></div><div class="todos-container"><ul class="todos-list"><li class="todo-item"><h3 class="todo-title">Нарезать овощи<p class="todo-desc">Салат, огурцы, зелень и др.</p><p class="todo-date">01.12.2025</p><div class="todo-priority high">Высокая</div><button class="todo-edit"><img src="bde33fdabb5936bd547d.svg" alt="Edit todo"/></button> <button class="todo-delete"><img src="8df2b8995c6c2b873fa7.svg" alt="Delete todo"/></button></h3></li></ul></div><footer class="footer full-bleed"></footer></div><dialog id="todo-dialog"><h2 class="todo-dialog-header">Изменение задачи</h2><form action="" method="dialog"><div class="dialog-form"><label for="todo-title-input"><p>Название задачи</p><input id="todo-title-input" required></label> <label for="todo-desc-input"><p>Описание</p><textarea name="" id="todo-desc-input" rows="3"></textarea></label> <label for="todo-date-input"><p>Дедлайн</p><input type="date" id="todo-date-input" required></label> <label for="todo-priority-select"><p>Приоритет</p><select name="todo-priority" id="todo-priority-select" required><option value="low">Низкий</option><option value="medium">Средний</option><option value="high">Высокий</option></select></label></div><div class="form-actions"><input id="todo-cancel-btn" type="submit" value="Отмена" formnovalidate> <input id="todo-save-btn" type="submit" value="Сохранить"></div></form></dialog><dialog id="project-dialog"><h2 class="project-dialog-header">Изменение имени проекта</h2><form action="" method="dialog"><div class="dialog-form"><label for="project-title-input"><p>Имя проекта</p><input id="project-title-input" required></label></div><div class="form-actions"><input id="project-cancel-btn" type="submit" value="Отмена" formnovalidate> <input id="project-save-btn" type="submit" value="Сохранить"></div></form></dialog><dialog id="delete-confirmation-dialog"><p class="delete-confirmation-dialog-header">Вы уверены, что хотите удалить объект?</p><form action="" method="dialog"><div class="form-actions"><input id="confirmation-no-btn" type="submit" value="Нет" formnovalidate> <input id="confirmation-yes-btn" type="submit" value="Да"></div></form></dialog></body></html>
