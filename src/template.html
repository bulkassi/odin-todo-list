<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header full-bleed">
        <img src="./public/svg/logo.svg" alt="Todo list manager logo" />
        <h1 class="logo-text">Планировщик задач</h1>
      </header>
      <main class="main-content">
        <aside class="projects-container">
          <ul class="projects-list">
            <li class="project-item">
              <button class="project-name">Приготовить еду</button>
              <button class="project-delete">
                <img src="./public/svg/delete.svg" alt="Delete project" />
              </button>
            </li>
            <li class="project-item">
              <button class="project-name">Сделать уборку</button>
              <button class="project-delete">
                <img src="./public/svg/delete.svg" alt="Delete project" />
              </button>
            </li>
          </ul>
        </aside>
        <div class="project-picked">
          <p class="project-name-header">Выбранный проект:</p>
          <h2 class="project-picked-name">
            Приготовить еду
          </h2>
          <button class="project-name-change">
            <img src="./public/svg/edit.svg" alt="Edit project">
            <p>Изменить имя</p>
          </button>
        </div>
        <div class="todos-container">
          <ul class="todos-list">
            <li class="todo-item">
              <h3 class="todo-title">Нарезать овощи</h2>
              <p class="todo-desc">Салат, огурцы, зелень и др.</p>
              <p class="todo-date">01.12.2025</p>
              <div class="todo-priority high">Высокая</div>
              <button class="todo-edit">
                <img src="./public/svg/edit-todo.svg" alt="Edit todo" />
              </button>
              <button class="todo-delete">
                <img src="./public/svg/delete-todo.svg" alt="Delete todo" />
              </button>
            </li>
          </ul>
        </div>
      </main>
      <footer class="footer full-bleed"></footer>
    </div>
    <dialog id="todo-dialog">
      <h2 class="todo-dialog-header">Изменение задачи</h2>
      <form action="" method="dialog">
        <div class="dialog-forms">
          <label for="todo-title-input">
            <p>Название задачи</p>
            <input type="text" id="todo-title-input" required>
          </label>
          <label for="todo-desc-input">
            <p>Описание</p>
            <textarea name="" id="todo-desc-input" rows="3"></textarea>
          </label>
          <label for="todo-date-input">
            <p>Дедлайн</p>
            <input type="date" id="todo-date-input" required>
          </label>
          <label for="todo-priority-select">
            <p>Приоритет</p>
            <select name="todo-priority" id="todo-priority-select" required>
              <option value="low">Низкий</option>
              <option value="medium">Средний</option>
              <option value="high">Высокий</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <input id="todo-cancel-btn" type="submit" value="Отмена" formnovalidate >
          <input id="todo-save-btn" type="submit" value="Сохранить" >
        </div>
      </form>
    </dialog>
  </body>
</html>
